name: Build PLGX

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install prerequisites
      run: |
        choco install keepass.install --version=2.61.1
        New-Item -ItemType Directory -Force .\KeePass | Out-Null
        $keePassExe = Join-Path $env:ProgramW6432 'KeePass Password Safe 2\KeePass.exe'
        Copy-Item $keePassExe .\KeePass\KeePass.exe

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: msbuild KeeAgent.sln /t:Restore

    - name: Build PLGX
      run: msbuild KeeAgent.sln /t:Build /p:Configuration=ReleasePlgx

    - name: List PLGX
      run: ~\.nuget\packages\plgxtool\1.0.3\tools\PlgxTool.exe -l .\KeeAgent\bin\ReleasePlgx\KeeAgent.plgx

    - uses: actions/upload-artifact@v4
      with:
        name: KeeAgent.plgx
        path: KeeAgent/bin/ReleasePlgx/KeeAgent.plgx
